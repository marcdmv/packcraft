[package]
name = "packcraft"
version = "0.1.0"
edition = "2024"
description = "Lossless archiver for creative assets, pure Rust: context mixing, Lepton JPEG, LMS audio"
license = "MIT OR Apache-2.0"
repository = "https://github.com/marcdmv/packcraft"
readme = "README.md"
keywords = ["compression", "archive", "context-mixing", "jpeg", "audio"]
categories = ["compression", "command-line-utilities"]

[features]
default = []
# The desktop app (packcraft-gui). The CLI and library build without it.
gui = ["dep:eframe", "dep:egui_extras"]

[[bin]]
name = "packcraft"
path = "src/main.rs"

[[bin]]
name = "packcraft-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[dependencies]
eframe = { version = "0.37.0", optional = true, default-features = false, features = ["glow", "accesskit", "clipboard", "x11"] }
egui_extras = { version = "0.37.0", optional = true, default-features = false }
brotli = "9.1.3"
crc32fast = "1.5.5"
lepton_jpeg = "0.5.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
